name: Dashboard

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm run test:dashboard

      - name: Typecheck
        run: pnpm run typecheck:dashboard

      - name: Build
        run: pnpm run build:dashboard
        env:
          NEXTAUTH_SECRET: ci-build-only
          NEXTAUTH_URL: http://localhost:3000
