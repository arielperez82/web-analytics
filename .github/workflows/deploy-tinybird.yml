name: Deploy to Tinybird

on:
  workflow_dispatch:
    inputs:
      target_job:
        type: choice
        description: Select the job to run
        options:
          - validate
          - deploy

permissions:
  contents: read

env:
  TINYBIRD_HOST: ${{ vars.TINYBIRD_HOST }}
  TINYBIRD_TOKEN: ${{ secrets.TINYBIRD_TOKEN }}

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Tinybird definitions
        run: pnpm run typecheck:tinybird

      - name: Deployment check
        run: pnpm run check:tinybird

  deploy:
    if: github.event.inputs.target_job == 'deploy'
    name: Deploy to Tinybird
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        run: cd apps/tinybird && pnpm exec tinybird deploy
